<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,sans-serif;background:#F8FAFC;color:#0F172A;direction:rtl}
.T{width:100%;border-collapse:collapse;font-size:13px}
.T th{padding:9px 12px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#94A3B8;border-bottom:1px solid #E2E8F0;background:#F8FAFC}
.T td{padding:10px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.T tr:hover td{background:#FAFBFF}
.btn{padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-family:Heebo,sans-serif;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.82}
.blue{background:#1D6FA4;color:#fff}.green{background:#10B981;color:#fff}
.red{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.gray{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0}
.sm{padding:3px 9px;font-size:11px;border-radius:6px;border:1px solid #E2E8F0;cursor:pointer;font-family:Heebo,sans-serif;font-weight:600;background:#fff}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-family:Heebo,sans-serif;text-align:right;background:transparent;color:#94A3B8;font-weight:400;margin-bottom:2px;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.on{background:#2388CC;color:#fff;font-weight:700}
.stat{background:#fff;border-radius:14px;padding:16px 20px;flex:1;min-width:110px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fg{display:flex;flex-direction:column;gap:3px;flex:1;min-width:100px}
.fg label{font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;color:#0F172A;font-family:Heebo,sans-serif;direction:rtl;width:100%;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#1D6FA4;box-shadow:0 0 0 2px rgba(29,111,164,.15)}
.sec{background:#F8FAFC;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sec-lbl{font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
/* Modal */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:none;align-items:center;justify-content:center}
#overlay.show{display:flex}
#mbox{background:#fff;border-radius:16px;padding:26px;width:92%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.badge{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:600}
.bg{background:#DCFCE7;color:#166534}.by{background:#FEF9C3;color:#854D0E}
.bb{background:#DBEAFE;color:#1E40AF}.br{background:#FEE2E2;color:#991B1B}

// Compress image to fit localStorage limits
function compressImage(dataUrl, maxW, quality, callback){
  if(dataUrl.indexOf('data:image')<0){callback(dataUrl);return;}
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    var ratio=Math.min(maxW/w,maxW/h,1);
    var cw=Math.round(w*ratio),ch=Math.round(h*ratio);
    var canvas=document.createElement('canvas');
    canvas.width=cw;canvas.height=ch;
    var ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,cw,ch);
    callback(canvas.toDataURL('image/jpeg',quality));
  };
  img.onerror=function(){callback(dataUrl);};
  img.src=dataUrl;
}

// Safe localStorage save with quota check
function safeLocalSave(key, value){
  try{
    localStorage.setItem('hpc_'+key, JSON.stringify(value));
    return true;
  } catch(e){
    if(e.name==='QuotaExceededError'||e.code===22){
      console.warn('localStorage quota exceeded for key:', key);
      return false;
    }
    return false;
  }
}

function saveAll(){
  var saved=true;
  // Save all SEED-based keys
  ['props','pays','tasks','leads','expenses','mgmt','activities'].forEach(function(k){
    if(S[k]!==undefined) saved=safeLocalSave(k,S[k])&&saved;
  });
  // Save special keys
  saved=safeLocalSave('photos',S.photos)&&saved;
  saved=safeLocalSave('contracts',S.contracts)&&saved;
  if(!saved) console.warn('Some data could not be saved due to storage limits');
  // Show save indicator
  var el=document.getElementById('sv-ind')||document.getElementById('SVIND');
  if(el){el.style.opacity=1;clearTimeout(svTimer);svTimer=setTimeout(function(){el.style.opacity=0;},2200);}
}

// ─── VIEW PROPERTY (read-only) ────────────────────────────────────────────
function viewProp(id){
  const p=S.props.find(x=>x.id===id); if(!p) return;
  const photos=S.photos[id]||[];
  const propPays=S.pays.filter(x=>x.address===p.address).slice(0,5);
  const propExp=S.expenses.filter(x=>x.propId===id).slice(0,4);
  const d=dd(p.contractEnd);
  const cc=d===null?"#94A3B8":d<0?"#DC2626":d<=30?"#DC2626":d<=90?"#D97706":"#059669";
  const cl=d===null?"—":d<0?`⚠ פג לפני ${Math.abs(d)} ימים`:d<=30?`⚠ ${d} ימים`:d+" ימים לסיום";
  const sc=p.status==="מושכר"?"bg":p.status==="פנוי"?"by":"bb";
  const extras=[p.parking?"🚗 חניה":"",p.balcony?`🌿 מרפסת${p.balconySize>0?" "+p.balconySize+'מר':""}`:"",(p.arnona>0?"ארנונה "+fmt(p.arnona)+"/חודש":""),(p.vaad>0?"ועד בית "+fmt(p.vaad)+"/חודש":"")].filter(Boolean).join("  |  ");

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <span class="badge ${sc}">${p.status}</span>
      <span style="font-size:13px;color:#64748B">${p.type}${p.rooms>0?" · "+p.rooms+" חד'":""}${p.floor>0?" · קומה "+p.floor:""}${p.size>0?" · "+p.size+'מר':""}</span>
      <div style="flex:1"></div>
      <button class="sm blue" onclick="closeM();setTimeout(()=>openM('עריכה – ${p.address.replace(/'/g,"\'")}',propForm(S.props.find(x=>x.id===${id}))),50)">✏️ עריכה</button>

      <button class="sm" style="background:#D1FAE5;color:#065F46" onclick="closeM();setTimeout(()=>shareModal(${id}),50)">📤 שתף</button>
    </div>

    ${photos.length>0?`<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px">${photos.map(ph=>`<img src="${ph.data}" style="height:90px;min-width:130px;max-width:160px;object-fit:cover;border-radius:8px;border:1px solid #E2E8F0;flex-shrink:0" title="${ph.year||""}${ph.caption?" – "+ph.caption:""}">`).join("")}</div>`:""}

    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1;background:#F0FDF4;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;margin-bottom:3px">שכירות חודשית</div><div style="font-size:22px;font-weight:800;color:#059669">${fmt(p.rent)}</div></div>
      <div style="flex:1;background:#EFF6FF;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;margin-bottom:3px">פיקדון</div><div style="font-size:18px;font-weight:800;color:#1D6FA4">${p.deposit>0?fmt(p.deposit):"—"}</div><div style="font-size:10px;color:#64748B">${p.depositType||""}</div></div>
      <div style="flex:1;background:${d!==null&&d<=30?"#FEF2F2":"#F8FAFC"};border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;margin-bottom:3px">חוזה עד</div><div style="font-size:14px;font-weight:700;color:${cc}">${p.contractEnd||"—"}</div><div style="font-size:11px;color:${cc};margin-top:2px">${cl}</div></div>

    <div style="margin-bottom:12px">

      ${p.owner?`<div style="display:flex;padding:7px 0;border-bottom:1px solid #F1F5F9"><div style="width:120px;font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase">בעלים</div><div style="font-size:13px">${p.owner}${p.ownerPhone?` <a href="tel:${p.ownerPhone}" style="color:#1D6FA4;text-decoration:none">📞 ${p.ownerPhone}</a>`:""}</div></div>`:""}
      ${p.contractStart?`<div style="display:flex;padding:7px 0;border-bottom:1px solid #F1F5F9"><div style="width:120px;font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase">תחילת חוזה</div><div style="font-size:13px">${p.contractStart}</div></div>`:""}
      ${extras?`<div style="display:flex;padding:7px 0;border-bottom:1px solid #F1F5F9"><div style="width:120px;font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase">נוספות</div><div style="font-size:13px">${extras}</div></div>`:""}
      ${p.notes?`<div style="display:flex;padding:7px 0;border-bottom:1px solid #F1F5F9"><div style="width:120px;font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase">הערות</div><div style="font-size:13px;color:#64748B">${p.notes}</div></div>`:""}

    </div>

    ${propPays.length>0?`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;margin-bottom:8px">תשלומים אחרונים</div>${propPays.map(x=>{const sc=x.status==="שולם"?"#059669":x.status==="ממתין"?"#D97706":"#DC2626";return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F1F5F9"><div style="flex:1;font-size:12px">${x.month}</div><div style="font-size:13px;font-weight:700;color:#1D6FA4">${fmt(x.amount)}</div><span style="font-size:11px;color:${sc};font-weight:600">${x.status}</span><span style="font-size:11px;color:#94A3B8">${x.date}</span></div>`;}).join("")}</div>`:""}

    ${propExp.length>0?`<div><div style="font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;margin-bottom:8px">הוצאות אחרונות</div>${propExp.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F1F5F9"><div style="flex:1;font-size:12px">${e.vendor} – ${e.desc||e.type}</div><div style="font-size:13px;font-weight:700;color:#EF4444">${fmt(e.amount)}</div><span style="font-size:10px;color:${e.invoiceReceived?"#059669":"#D97706"}">${e.invoiceReceived?"✓ חשבונית":"⚠ חסרה"}</span></div>`).join("")}</div>`:""}
  `);
}

function saveProp(id){
  const v={address:gv("pf_a"),city:gv("pf_b"),area:gv("pf_area"),building:gv("pf_z"),type:gv("pf_c"),status:gv("pf_d"),
    rooms:+gv("pf_e")||0,size:+gv("pf_f")||0,floor:+gv("pf_g")||0,rent:+gv("pf_h")||0,
    owner:gv("pf_i"),ownerPhone:gv("pf_j"),tenant:gv("pf_k")||"-",tenantPhone:gv("pf_l"),
    contractStart:gv("pf_m"),contractEnd:gv("pf_n"),
    deposit:+gv("pf_o")||0,depositType:gv("pf_dt")||"מזומן",depositPaid:gc("pf_p"),depositReturned:gc("pf_q"),
    arnona:+gv("pf_ar")||0,vaad:+gv("pf_va")||0,balconySize:+gv("pf_bs")||0,
    parking:gc("pf_pk"),balcony:gc("pf_bl"),notes:gv("pf_nt")};
  if(id===-1){S.props.unshift({...v,id:Date.now()});}
  else{const i=S.props.findIndex(p=>p.id===id);if(i>-1)S.props[i]={...S.props[i],...v};}
  saveAll();closeM();render();
}
function delProp(id){if(!confirm("למחוק נכס זה?"))return;S.props=S.props.filter(p=>p.id!==id);saveAll();render();}

        <div class="fg" style="max-width:90px"><label>שנה</label><input id="phy" type="number" placeholder="${new Date().getFullYear()}" style="font-size:13px;padding:7px;border-radius:8px;border:1px solid #E2E8F0;width:100%"></div>

function addPhotos(propId){
  var fileEl=document.getElementById('phf');
  var year=document.getElementById('phy')?.value||String(new Date().getFullYear());
  var caption=document.getElementById('phc')?.value||'';
  if(!fileEl||!fileEl.files||!fileEl.files.length){alert('בחר קובץ');return;}
  if(!S.photos[propId])S.photos[propId]=[];
  var files=Array.from(fileEl.files);
  var loaded=0,total=files.length;
  files.forEach(function(file){
    var r=new FileReader();
    r.onload=function(ev){
      var raw=ev.target.result;
      // Compress images before saving (max 800px, 70% quality)
      compressImage(raw,800,0.7,function(compressed){
        S.photos[propId].push({data:compressed,year:year,caption:caption});
        if(++loaded===total){
          var ok=safeLocalSave('photos',S.photos);
          if(!ok){
            alert('האחסון מלא – התמונות נשמרו זמנית. מומלץ לעשות גיבוי ולמחוק תמונות ישנות.');
          }
          openPhotos(propId);
        }
      });
    };
    r.readAsDataURL(file);
  });
}
function delPhoto(propId,idx){
  if(!confirm("למחוק תמונה זו?"))return;
  S.photos[propId].splice(idx,1);
  saveAll();openPhotos(propId);
}

function saveLead(id){const v={name:gv("lf_n"),phone:gv("lf_p"),source:gv("lf_s"),budget:gv("lf_b"),area:gv("lf_a"),status:gv("lf_st"),notes:gv("lf_nt"),date:new Date().toLocaleDateString("he-IL")};

  var v={propId:pid,address:prop?(prop.address+(prop.unit?" – "+prop.unit:"")):"",owner:prop?prop.owner:"",ownerPhone:prop?prop.ownerPhone:"",
    feeType:gv("mf_type")||"הוראת קבע",monthlyFee:isSO?(+gv("mf_mfee")||0):0,

function saveContract(){
  var pid=+gv('cf_pid')||null;
  var prop=pid?getPropById(pid):null;
  var file=document.getElementById('cf_file');
  var base={propId:pid,address:prop?(prop.address+(prop.unit?' \u2013 '+prop.unit:'')):'',
    type:gv('cf_type'),yearRange:gv('cf_year')||_cYear,
    amount:+gv('cf_amt')||0,notes:gv('cf_notes'),
    uploadDate:new Date().toLocaleDateString('he-IL'),filename:'',fileData:null};
  if(file&&file.files&&file.files[0]){
    var f=file.files[0];
    // Check file size (max 2MB per file)
    if(f.size>2*1024*1024){
      alert('הקובץ גדול מדי (מקסימום 2MB). דחס את הקובץ ונסה שוב.');
      return;
    }
    var fname=f.name;
    var r=new FileReader();
    r.onload=function(ev){
      var entry=Object.assign({id:Date.now(),filename:fname,fileData:ev.target.result},base);
      // For images - compress them
      if(ev.target.result.indexOf('data:image')===0){
        compressImage(ev.target.result,1200,0.8,function(compressed){
          entry.fileData=compressed;
          S.contracts.unshift(entry);
          var ok=safeLocalSave('contracts',S.contracts);
          if(!ok) alert('האחסון מלא. מחק חוזים ישנים כדי לפנות מקום.');
          else saveAll();
          closeM();render();
        });
      } else {
        S.contracts.unshift(entry);
        var ok=safeLocalSave('contracts',S.contracts);
        if(!ok) alert('הקובץ גדול מדי לאחסון. נסה קובץ קטן יותר.');
        else saveAll();
        closeM();render();
      }
    };
    r.readAsDataURL(f);
  } else {
    S.contracts.unshift(Object.assign({id:Date.now()},base));
    saveAll();closeM();render();
  }
}

      </div>
      <div style="display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid #F1F5F9;flex-shrink:0">
        <div style="background:#FEF2F2;border-radius:8px;padding:8px 14px;flex:1;text-align:center"><div style="font-size:9px;color:#94A3B8;font-weight:700;text-transform:uppercase">סה"כ הוצאות</div><div style="font-size:18px;font-weight:800;color:#EF4444">${fmt(shown.reduce((s,e)=>s+Number(e.amount),0))}</div></div>
        <div style="background:#FEF3C7;border-radius:8px;padding:8px 14px;flex:1;text-align:center"><div style="font-size:9px;color:#94A3B8;font-weight:700;text-transform:uppercase">ממתין לחשבונית</div><div style="font-size:18px;font-weight:800;color:#D97706">${shown.filter(e=>!e.invoiceReceived).length}</div></div>
        <div style="background:#F0FDF4;border-radius:8px;padding:8px 14px;flex:1;text-align:center"><div style="font-size:9px;color:#94A3B8;font-weight:700;text-transform:uppercase">מספר הוצאות</div><div style="font-size:18px;font-weight:800;color:#059669">${shown.length}</div></div>
      </div>
      <div style="overflow-y:auto;flex:1">
        ${shown.length===0?`<div style="text-align:center;color:#94A3B8;padding:40px;font-size:14px">אין הוצאות${selP?" לנכס זה":""}<br><button class="btn blue" style="margin-top:12px" onclick='openM("הוצאה חדשה",expForm(null,${expPropId||"null"}))'>+ הוסף הוצאה</button></div>`:""}
        ${shown.map((e,i)=>{const pc=e.paymentMethod==="ביט"?"#8B5CF6":e.paymentMethod==="העברה בנקאית"?"#1D6FA4":e.paymentMethod==="מזומן"?"#059669":"#94A3B8";
          return`<div style="padding:12px 18px;border-bottom:1px solid #F1F5F9;display:flex;align-items:flex-start;gap:12px;background:${i%2===0?"#fff":"#FAFBFF"}">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="font-size:13px;font-weight:600">${e.vendor}</div><span style="background:#F1F5F9;color:#475569;border-radius:5px;padding:1px 7px;font-size:11px">${e.type}</span>${!selP?`<span style="background:#EFF6FF;color:#1D6FA4;border-radius:5px;padding:1px 7px;font-size:11px">${e.address||""}</span>`:""}</div>
              <div style="font-size:12px;color:#64748B;margin-bottom:4px">${e.desc||""}</div>
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span style="font-size:11px;color:#94A3B8">📅 ${e.date}</span>
                <span style="font-size:11px;color:${pc};font-weight:600">💳 ${e.paymentMethod||"לא צוין"}</span>
                ${e.invoiceReceived?`<span style="font-size:11px;color:#059669;font-weight:600">✓ חשבונית</span>`:`<span style="font-size:11px;color:#D97706">⚠ חשבונית חסרה</span>`}
                ${e.invoiceData?`<button onclick="viewInv(${e.id})" style="font-size:11px;color:#1D6FA4;background:none;border:none;cursor:pointer;text-decoration:underline">📎 צפה</button>`:""}
              </div>
            </div>
            <div style="text-align:left;flex-shrink:0">
              <div style="font-size:16px;font-weight:800;color:#EF4444">${fmt(e.amount)}</div>
              <div style="display:flex;gap:4px;margin-top:6px">
                <button class="sm" style="background:#EFF6FF;color:#1D6FA4" onclick='openM("עריכת הוצאה",expForm(S.expenses.find(x=>x.id===${e.id}),${expPropId||"null"}))'>✏️</button>
                <button class="sm" style="background:#FEF2F2;color:#991B1B" onclick="dlExp(${e.id})">🗑</button>
              </div>
            </div>
          </div>`;}).join("")}
      </div>
    </div>
  </div>`;
}
function viewInv(id){const e=S.expenses.find(x=>x.id===id);if(!e||!e.invoiceData)return;const w=window.open("","_blank");if(e.invoiceData.startsWith("data:image")){w.document.write(`<html><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="${e.invoiceData}" style="max-width:100%;max-height:100vh"></body></html>`);}else{w.document.write(`<html><body style="margin:0"><embed src="${e.invoiceData}" width="100%" height="100vh"></body></html>`);}w.document.close();}

render();
</script>
</body>
</html>
